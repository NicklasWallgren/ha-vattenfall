name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  release:
    name: Publish zip file
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      INTEGRATION_PATH: ${{ github.workspace }}/custom_components/vattenfall
    steps:
      - name: Check out code
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set version in manifest.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "Setting version to ${version}"
          sed -i -E "s|\"version\": \"[^\"]+\"|\"version\": \"${version}\"|" ${INTEGRATION_PATH}/manifest.json

      - name: Commit version bump and move tag
        run: |
          tag="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- "${INTEGRATION_PATH}/manifest.json"; then
            git add "${INTEGRATION_PATH}/manifest.json"
            git commit -m "chore(manifest): bump version to ${tag}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
            git tag -f "${tag}"
            git push origin "refs/tags/${tag}" --force
          else
            echo "manifest.json version already up to date, skipping commit"
          fi

      - name: Zip
        run: |
          cd $INTEGRATION_PATH
          zip vattenfall.zip -r ./
          ls -l *.zip

      - name: Include zip in release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: ${{ env.INTEGRATION_PATH }}/vattenfall.zip
          fail_on_unmatched_files: true
